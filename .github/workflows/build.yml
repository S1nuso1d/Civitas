name: Build Civitas

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# New pushes supersede older builds for the same branch; avoid wasting runners on stale commits.
concurrency:
  group: civitas-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 8.8
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Compile and test mod
        run: gradle build --no-daemon

      - name: Read mod version
        id: mod-version
        shell: bash
        run: echo "mod_version=$(grep '^mod_version=' gradle.properties | cut -d= -f2)" >> "$GITHUB_OUTPUT"

      - name: Upload mod JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: civitas-${{ steps.mod-version.outputs.mod_version }}-forge-1.21.1
          path: build/libs/*.jar
          if-no-files-found: error
