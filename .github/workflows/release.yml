name: Release Civitas

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 8.8
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Verify tag matches mod version
        shell: bash
        run: |
          VERSION="$(grep '^mod_version=' gradle.properties | cut -d= -f2)"
          if [ "${GITHUB_REF_NAME}" != "v${VERSION}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match mod_version ${VERSION}"
            exit 1
          fi

      - name: Build and test
        run: gradle build --no-daemon

      - name: Publish GitHub Release with JAR
        uses: softprops/action-gh-release@v2
        with:
          name: Civitas ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: true
          files: build/libs/*.jar
